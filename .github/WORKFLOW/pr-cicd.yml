name: Pintos Test CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 gcc g++ make perl python3

          # Pintos는 qemu-system-x86_64를 qemu로 인식하지 못하므로 symlink 필수
          if [ -f /usr/bin/qemu-system-i386 ]; then
            sudo ln -sf /usr/bin/qemu-system-i386 /usr/bin/qemu
          else
            sudo ln -sf /usr/bin/qemu-system-x86_64 /usr/bin/qemu
          fi

          qemu --version

      - name: Activate Pintos Environment
        shell: bash
        run: |
          source ./activate
          echo "$GITHUB_WORKSPACE/utils" >> "$GITHUB_PATH"

      - name: Run Pintos Tests
        env:
          PINTOSOPTS: -v
        run: |
          set +e

          # ✔ 배열 선언 방식 수정됨
          projects=(threads userprog vm)

          echo "## 🚀 Pintos CI Report" > test-summary.md
          echo "" >> test-summary.md
          echo "**Commit:** \`${{ github.event.pull_request.head.sha }}\`" >> test-summary.md
          echo "" >> test-summary.md

          total_pass=0
          total_tests=0

          for project in "${projects[@]}"; do
            echo "::group::Running tests: $project"

            if [ ! -d "$project" ]; then
              echo "### ⚠️ Missing project directory: $project" >> test-summary.md
              echo "" >> test-summary.md
              echo "::endgroup::"
              continue
            fi

            cd "$project"

            # ✔ make -j 로 빌드 속도 향상
            make clean
            if ! make -j4; then
              echo "### ⛔ ${project}: Build Failed" >> "$GITHUB_WORKSPACE/test-summary.md"
              echo "" >> "$GITHUB_WORKSPACE/test-summary.md"
              cd "$GITHUB_WORKSPACE"
              echo "::endgroup::"
              continue
            fi

            cd build

            # ✔ 불필요한 verbose 제거 → 속도 증가
            make check || true

            result_files=$(find tests -name '*.result' | sort)
            count=$(echo "$result_files" | wc -l | tr -d ' ')

            if [ "$count" -eq 0 ]; then
              echo "### ⚠️ ${project}: No tests found" >> "$GITHUB_WORKSPACE/test-summary.md"
              echo "" >> "$GITHUB_WORKSPACE/test-summary.md"
              cd "$GITHUB_WORKSPACE"
              echo "::endgroup::"
              continue
            fi

            pass=0

            echo "### 📂 ${project}" >> "$GITHUB_WORKSPACE/test-summary.md"
            echo "" >> "$GITHUB_WORKSPACE/test-summary.md"
            echo "<details>" >> "$GITHUB_WORKSPACE/test-summary.md"
            echo "<summary><b>${count} Tests</b> — Click to expand</summary>" >> "$GITHUB_WORKSPACE/test-summary.md"
            echo "" >> "$GITHUB_WORKSPACE/test-summary.md"

            for file in $result_files; do
              name=$(basename "$file" .result)
              if grep -q PASS "$file"; then
                echo "- 🟢 \`$name\`" >> "$GITHUB_WORKSPACE/test-summary.md"
                pass=$((pass + 1))
              else
                echo "- 🔴 \`$name\`" >> "$GITHUB_WORKSPACE/test-summary.md"
              fi
            done

            echo "" >> "$GITHUB_WORKSPACE/test-summary.md"
            echo "</details>" >> "$GITHUB_WORKSPACE/test-summary.md"
            echo "" >> "$GITHUB_WORKSPACE/test-summary.md"

            rate=$(awk "BEGIN {printf \"%.1f%%\", ($pass/$count)*100}")
            echo "**Summary:** ${pass}/${count} passed (${rate})" >> "$GITHUB_WORKSPACE/test-summary.md"
            echo "" >> "$GITHUB_WORKSPACE/test-summary.md"

            total_pass=$((total_pass + pass))
            total_tests=$((total_tests + count))

            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

          if [ "$total_tests" -gt 0 ]; then
            overall=$(awk "BEGIN {printf \"%.1f%%\", ($total_pass/$total_tests)*100}")
            echo "---" >> test-summary.md
            echo "" >> test-summary.md
            echo "## 📊 Overall Result" >> test-summary.md
            echo "" >> test-summary.md
            echo "**${total_pass} / ${total_tests}** tests passed (${overall})" >> test-summary.md
            echo "" >> test-summary.md
          fi

          echo "_Generated at $(date -u +'%Y-%m-%d %H:%M UTC')_" >> test-summary.md
          cat test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find Previous CI Comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "🚀 Pintos CI Report"

      - name: Update PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: test-summary.md
          edit-mode: replace

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pintos-test-results
          path: |
            */build/tests/**/*.output
            */build/tests/**/*.result
            test-summary.md
          retention-days: 7
